[project]
name = "mlbb-downloader"
version = "0.1.0"
description = "Download Mobile Legends: Bang Bang data from the Rone Arena API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "typer>=0.15",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.8",
]

[project.scripts]
mlbb = "mlbb_downloader.cli:app"
mlbb-gui = "mlbb_downloader.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbb_downloader"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
