name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Pytest
        run: uv run pytest
