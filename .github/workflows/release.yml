name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra gui --extra packaging --dev
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv run pyinstaller packaging/mlbb-downloader.spec --noconfirm
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
